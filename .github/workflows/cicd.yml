name: CI/CD Pipeline

on:
  push:
    branches: [ dev-feri, main-feri ]

jobs:
  build-and-push:
    name: Build and push Docker images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend-core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/backend-core/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sensum-backend-core:latest

      - name: Build and push eltratec-gm
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/eltratec-gm/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sensum-eltratec-gm:latest

      - name: Build and push api-gateway
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api-gateway/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/sensum-api-gateway:latest

  notify-server:
    name: Notify server via webhook
    runs-on: ubuntu-latest
    needs: build-and-push
    if: needs.build-and-push.result == 'success'

    steps:
      - name: Send webhook to Azure VM
        uses: distributhor/workflow-webhook@v3
        with:
          webhook_url: ${{ secrets.WEBHOOK_URL }}
          webhook_secret: ${{ secrets.WEBHOOK_SECRET }}
          data: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}"}'