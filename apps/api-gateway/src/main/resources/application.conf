ktor {
  application {
    modules = [ si.sensum.api.ApplicationKt.module ]
  }

  deployment {
    port = 8080
    port = ${?API_GATEWAY_PORT}

    host = "0.0.0.0"
    host = ${?API_GATEWAY_HOST}
  }
}

backendCore {
  baseUrl = "http://localhost:8082"
  baseUrl = ${?BACKEND_CORE_BASE_URL}
}

auth {
  username = "sensum"
  username = ${?API_AUTH_USERNAME}

  password = "sensum"
  password = ${?API_AUTH_PASSWORD}
}

jwt {
  # Base64-encoded PKCS8 DER private key for RS256.
  # Leave empty to auto-generate a new key pair on startup (tokens are invalidated on restart).
  # Set JWT_PRIVATE_KEY env var for a persistent key across restarts.
  privateKey = ""
  privateKey = ${?JWT_PRIVATE_KEY}

  issuer = "sensum-api-gateway"
  issuer = ${?JWT_ISSUER}

  audience = "sensum-clients"
  audience = ${?JWT_AUDIENCE}

  realm = "sensum-api"
  realm = ${?JWT_REALM}

  ttlSeconds = 3600
  ttlSeconds = ${?JWT_TTL_SECONDS}
}