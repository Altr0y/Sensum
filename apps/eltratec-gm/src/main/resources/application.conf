ktor {
  application {
    modules = [ si.sensum.gm.ApplicationKt.module ]
  }

  deployment {
    port = 8081
    port = ${?GM_PORT}

    host = "0.0.0.0"
    host = ${?GM_HOST}
  }
}

gm {
  auth {
    tokenTtlHours = 8
    tokenTtlHours = ${?GM_AUTH_TOKEN_TTL_HOURS}
  }

  serviceJwt {
    secret = "local-development-gm-service-secret-32-chars"
    secret = ${?GM_SERVICE_JWT_SECRET}

    issuer = "sensum-backend-core"
    issuer = ${?GM_SERVICE_JWT_ISSUER}

    audience = "sensum-eltratec-gm"
    audience = ${?GM_SERVICE_JWT_AUDIENCE}

    realm = "sensum-gm-service"
    realm = ${?GM_SERVICE_JWT_REALM}
  }
}

sws {
  baseUrl = "https://smart.eltratec.com/SmartWebDev/SmartWebService.asmx"
  baseUrl = ${?SWS_BASE_URL}

  timeoutMillis = 10000
  timeoutMillis = ${?SWS_TIMEOUT_MILLIS}
}